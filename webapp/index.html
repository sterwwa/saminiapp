.standalone-sheet{width:100%;max-width:620px;max-height:min(88dvh,760px);overflow-y:auto;overscroll-behavior:contain;background:var(--panel);color:var(--text);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding:12px 24px calc(24px + env(safe-area-inset-bottom));box-shadow:var(--shadow);transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.75,.25,1)}
.standalone-sheet.is-open{transform:translateY(0)}
.standalone-sheet-top{height:28px;display:flex;align-items:center;justify-content:center;position:relative;margin-bottom:20px}
.standalone-sheet-handle{width:50px;height:4px;border-radius:99px;background:var(--muted);opacity:.36}
.standalone-sheet-close{position:absolute;right:-8px;top:-2px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);color:var(--muted);font-size:25px;line-height:1}
.standalone-sheet-title{font-size:23px;line-height:1.2;font-weight:850;letter-spacing:-.45px;color:var(--text);margin:0 0 12px}
.standalone-sheet-description{font-size:14px;line-height:1.6;color:var(--muted);margin:0 0 22px}
.standalone-sheet-steps{list-style:none;counter-reset:sheet-step;padding:0;margin:0 0 26px;display:grid;gap:17px}
.standalone-sheet-steps li{counter-increment:sheet-step;display:flex;align-items:flex-start;gap:11px;color:var(--text);font-size:15px;line-height:1.45;font-weight:650}
.standalone-sheet-steps li:before{content:counter(sheet-step) ".";color:var(--accent);font-weight:850;min-width:17px}
.standalone-sheet-cta{width:100%;min-height:54px;border-radius:15px;background:var(--accent);color:var(--accentText);display:flex;align-items:center;justify-content:center;gap:10px;font-size:15px;font-weight:800;box-shadow:0 8px 22px rgba(139,92,246,.22)}
.standalone-sheet-cta svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.standalone-sheet-close:focus-visible,.standalone-sheet-cta:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@media(prefers-reduced-motion:reduce){.standalone-sheet-backdrop,.standalone-sheet{transition:none}}

html.auth-pending body>*:not(.standalone-sheet-backdrop){display:none!important}
html.auth-pending body>.standalone-sheet-backdrop{display:flex!important;visibility:visible!important}

.install-app-icon img{width:100%;height:100%;object-fit:contain;border-radius:inherit;display:block}
.install-title{font-size:29px;line-height:1.1;letter-spacing:-.9px;font-weight:850;margin:0;text-align:center}
.install-subtitle{font-size:14px;line-height:1.5;color:#a6a2b5;text-align:center;max-width:330px;margin:10px 0 23px}
.install-steps{width:100%;display:grid;gap:10px}
.install-step{display:flex;align-items:center;gap:13px;padding:14px 14px;border-radius:18px;background:linear-gradient(145deg,rgba(24,23,37,.97),rgba(16,16,26,.98));border:1px solid rgba(164,132,236,.13);box-shadow:0 8px 22px rgba(0,0,0,.19),inset 0 1px 0 rgba(255,255,255,.025);min-height:72px}
.install-number{width:35px;height:35px;flex:none;border-radius:50%;display:grid;place-items:center;background:rgba(139,92,246,.15);border:1px solid rgba(167,139,250,.28);color:#c5aaff;font-size:15px;font-weight:850}
.install-step-copy{font-size:13px;line-height:1.48;color:#eeecf5}
.install-step-copy strong{color:#fff;font-weight:800}
.install-step-copy svg{width:16px;height:16px;display:inline-block;vertical-align:-3px;margin:0 2px;color:#c4a4ff;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.install-browser-link{border:0;background:none;color:#b99aff;font:700 13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;margin:19px 0 0;padding:9px 12px;text-align:center;cursor:pointer}
.install-browser-link span{color:#d4c2ff;font-size:17px;margin-left:4px}
.install-browser-link:active{opacity:.72}
@media(max-height:760px){#installLanding{padding-top:calc(16px + env(safe-area-inset-top));padding-bottom:calc(16px + env(safe-area-inset-bottom))}.install-app-icon{width:66px;height:66px;border-radius:20px;margin:0 0 12px}.install-app-icon img{width:100%;height:100%}.install-title{font-size:26px}.install-subtitle{margin:7px 0 15px}.install-steps{gap:8px}.install-step{min-height:62px;padding:11px 12px}.install-number{width:31px;height:31px}.install-step-copy{font-size:12px}}
@media(prefers-reduced-motion:reduce){#installLanding *{scroll-behavior:auto!important}}
